<div class="container mt-5" style="max-width: 400px; border: 1px solid #ccc; padding: 30px; border-radius: 10px; background: #f9f9f9;">
  <h3 class="text-center mb-4">Login</h3>
  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <!-- Username -->
    <div class="mb-3">
      <label class="form-label">Username:</label>
      <input type="text" class="form-control" name="username"
             [(ngModel)]="user.username" #username="ngModel"
             required minlength="4"
             [class.is-invalid]="username.invalid && username.touched">
      <div class="invalid-feedback">
        <small *ngIf="username.errors?.['required']">Please enter your username.</small>
        <small *ngIf="username.errors?.['minlength']">Username must be at least 4 characters.</small>
      </div>
    </div>

<!-- Password -->
    <div class="mb-3">
      <label class="form-label">Password:</label>
      <input type="password" class="form-control" name="password"
             [(ngModel)]="user.password" #password="ngModel"
             required
             [class.is-invalid]="password.invalid && password.touched">
      <div class="invalid-feedback">
        <small>Please enter your password.</small>
      </div>
    </div>
    <!-- Remember login information -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="rememberMe"
             id="remember" [(ngModel)]="user.rememberMe">
      <label class="form-check-label" for="remember">Remember login information</label>
    </div>

    <!-- Login button: Only enabled when form.valid = true -->
    <button type="submit" class="btn btn-success w-100" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
</div>
