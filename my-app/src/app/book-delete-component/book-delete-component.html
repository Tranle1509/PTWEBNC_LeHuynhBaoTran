<section class="book-delete">
  @if (errMessage()) {
    <p class="error">{{ errMessage() }}</p>
  }

  <table>
    <thead>
      <tr>
        <th>BookId</th>
        <th>BookName</th>
        <th>Price</th>
        <th>Image</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (book of books(); track book.BookId) {
        <tr>
          <td>{{ book.BookId }}</td>
          <td>{{ book.BookName }}</td>
          <td>{{ book.Price }}</td>
          <td>
            <img [src]="server_images_link + book.Image" [alt]="book.BookName">
          </td>
          <td>
            <button type="button" (click)="deleteBook(book.BookId)">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Not found books</td>
        </tr>
      }
    </tbody>
  </table>
</section>
