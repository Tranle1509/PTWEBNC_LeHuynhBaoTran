<div class="container mt-4" style="max-width: 500px; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
  <h2 class="text-center mb-4">Course registration</h2>
  <form #courseForm="ngForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name:</label>
      <input type="text" class="form-control" name="fullName"
             [(ngModel)]="courseModel.fullName" required placeholder="Enter name">
    </div>
    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" name="email"
             [(ngModel)]="courseModel.email" required email placeholder="Enter email">
    </div>

    <!-- phone -->
    <div class="mb-3">
      <label class="form-label">Phone:</label>
      <input type="tel" class="form-control" name="phone"
             [(ngModel)]="courseModel.phone" required>
    </div>
    <!– Course selection -->
    <div class="mb-3">
      <label class="form-label">Course selection:</label>
      <select class="form-select" name="course" [(ngModel)]="courseModel.course" required>
        <option value="">------------</option>
        <option value="angular">Basic Angular</option>
        <option value="nodejs">Advanced Node.js</option>
        <option value="datascience">Data Science</option>
      </select>
    </div>

    <!-- Select a class shift -->
    <div class="mb-3">
      <label class="form-label me-3"> Select a class :</label>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="select_class" id="morning" value="morning"
               [(ngModel)]="courseModel.select_class">
        <label class="form-check-label" for="morning">Morning</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="select_class" id="afternoon" value="afternoon"
               [(ngModel)]="courseModel. select_class ">
        <label class="form-check-label" for="afternoon">Afternoon</label>
      </div>
    </div>

    <!-- Agree to terms -->
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="agree" id="checkTerms"
             [(ngModel)]="courseModel.agree" required>
      <label class="form-check-label" for="checkTerms"> Agree to terms </label>
    </div>
    <!-- Submit -->
    <button type="submit" class="btn btn-primary w-25" [disabled]="courseForm.invalid">Submit</button>
    <!-- Debug area to display data state for students to review (Optional) -->
    <hr>
    <div class="mt-3 p-2 bg-light border border-info rounded">
      <small class="text-primary"><b> Current Object State:</b></small>
      <pre class="mb-0" style="font-size: 11px;">{{ courseModel | json }}</pre>
    </div>
  </form>
</div>
