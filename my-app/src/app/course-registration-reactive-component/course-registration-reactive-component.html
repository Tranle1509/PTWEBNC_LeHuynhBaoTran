<div class="container mt-4" style="max-width: 500px; border: 1px solid #ddd;
 padding: 20px; border-radius: 8px;">
  <!-- Use uppercase Pipe for the title-->
  <form>
    <h3 class="text-center mb-4">{{ "Course Registration" | uppercase }}</h3>
    <!-- Name -->
    <div class="mb-3">
      <label class="form-label fw-bold" for="name">Name:</label>
      <input type="text" id="name" class="form-control"
             name="name" placeholder="Enter your name">
      <div class="text-danger" *ngIf="regForm.get('name')?.invalid && regForm.get('name')?.touched">
        <small>Please enter your name.</small>
      </div>
    </div>
    <!-- Email -->
    <div class="mb-3">
      <label class="form-label fw-bold">Email:</label>
      <input type="email" class="form-control"
             name="email" placeholder="test@gmail.com">
      <div class="text-danger" *ngIf="regForm.get('email')?.invalid && regForm.get('email')?.touched">
        <small>Email format is invalid.</small>
      </div>
    </div>
    <!-- Password -->
    <div class="mb-3">
      <label class="form-label fw-bold">Password:</label>
      <input type="password" class="form-control" name="password">
    </div>
    <!-- Confirm password (confirmPass) -->
    <div class="mb-3">
      <label class="form-label fw-bold">Confirm Password:</label>
      <input type="password" class="form-control" name="confirmPass">
      <!-- Display mismatch error from regForm -->
      <div class="text-danger" *ngIf="regForm.errors?.['mismatch'] && regForm.get('confirmPass')?.touched">
        <small>Confirmation password does not match.</small>
      </div>
    </div>
    <!-- Buttons -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="submit" class="btn btn-primary px-4"
        [disabled]="regForm.invalid">Register</button>
      <button type="button" class="btn btn-secondary px-3"
        (click)="setDefaultValues()">Default values</button>
    </div>
  </form>
</div>
